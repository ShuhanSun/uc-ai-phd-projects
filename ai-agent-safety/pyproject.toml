[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-safety-gateway"
version = "0.1.0"
description = "A dependency-free safety gateway for tool-using AI agents"
requires-python = ">=3.10"

[project.scripts]
agent-safety = "agent_safety.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
